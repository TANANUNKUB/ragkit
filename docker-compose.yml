services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Optional observability stack. Uncomment and set LANGFUSE_* in a .env file.
  # Langfuse also needs a Postgres + clickhouse (or the official compose bundle).
  # Prefer their documented compose: https://langfuse.com/docs/deployment/self-host
  #
  # langfuse-web:
  #   image: langfuse/langfuse:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - DATABASE_URL=postgresql://langfuse:langfuse@postgres:5432/langfuse
  #     - NEXTAUTH_URL=http://localhost:3000
  #     - NEXTAUTH_SECRET=change-me
  #     - SALT=change-me
  #   depends_on:
  #     - postgres
  #
  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: langfuse
  #     POSTGRES_PASSWORD: langfuse
  #     POSTGRES_DB: langfuse
  #   volumes:
  #     - langfuse_pg:/var/lib/postgresql/data

volumes:
  qdrant_data:
  # langfuse_pg:
